<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <!-- Monetag Multitag: OnClick + In-Page Push + Vignette + Push Notifications -->
  <script src="https://quge5.com/88/tag.min.js" data-zone="238491" async data-cfasync="false"></script>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GlobalNewShots | Premium Sensational Reporting</title>
  <link rel="icon" type="image/png" href="favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --fire: #e85d04;
      --steel: #b0b8c1;
      --dark: #06090f;
      --dark2: #0d1117;
      --red: #c1121f;
      --amber: #fca311;
      --text: #e8eaf0;
      --muted: #6b7280;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    
    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--dark);
      color: var(--text);
      line-height: 1.6;
    }

    /* Top Breaking Bar */
    .breaking-bar {
      background-color: var(--red);
      color: white;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      gap: 15px;
      font-weight: 700;
      text-transform: uppercase;
      font-size: 0.85rem;
      letter-spacing: 1px;
    }
    
    .pulsing-dot {
      width: 10px;
      height: 10px;
      background-color: white;
      border-radius: 50%;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.7); }
      70% { box-shadow: 0 0 0 10px rgba(255, 255, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0); }
    }

    /* Main Header */
    header {
      background: linear-gradient(180deg, var(--dark2) 0%, var(--dark) 100%);
      border-bottom: 2px solid var(--fire);
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 100;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 15px;
      text-decoration: none;
    }

    .logo {
      height: 60px;
      width: auto;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.1);
      box-shadow: 0 0 20px rgba(232, 93, 4, 0.3);
    }

    .brand-text {
      color: var(--steel);
      font-size: 1.8rem;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: -1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.8);
    }
    
    .brand-text span {
      color: var(--fire);
    }

    /* Container */
    .container {
      max-width: 1200px;
      margin: 40px auto;
      padding: 0 20px;
    }

    /* Grid Layout */
    .news-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
      gap: 30px;
    }

    /* Article Cards */
    .card {
      background: var(--dark2);
      border-radius: 12px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,0.05);
      transition: transform 0.3s, box-shadow 0.3s;
      display: flex;
      flex-direction: column;
    }

    .card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(232, 93, 4, 0.15);
      border-color: rgba(232, 93, 4, 0.3);
    }

    .card img {
      width: 100%;
      aspect-ratio: 16/9;
      object-fit: cover;
      border-bottom: 3px solid var(--red);
    }

    .card-content {
      padding: 20px;
      flex-grow: 1;
      display: flex;
      flex-direction: column;
    }

    .tag {
      background: var(--red);
      color: white;
      padding: 4px 10px;
      border-radius: 4px;
      font-size: 0.7rem;
      font-weight: 900;
      text-transform: uppercase;
      display: inline-block;
      margin-bottom: 15px;
      align-self: flex-start;
    }

    .card-title {
      color: var(--text);
      font-size: 1.25rem;
      font-weight: 800;
      line-height: 1.3;
      margin-bottom: 10px;
      text-decoration: none;
    }

    .card-title:hover {
      color: var(--amber);
    }

    .card-meta {
      margin-top: auto;
      color: var(--muted);
      font-size: 0.8rem;
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 15px;
    }

    /* Empty state */
    .empty-state {
      text-align: center;
      padding: 60px 20px;
      grid-column: 1 / -1;
      background: rgba(255,255,255,0.02);
      border-radius: 12px;
      border: 1px dashed rgba(255,255,255,0.1);
    }
    .empty-state h2 { color: var(--steel); margin-bottom: 10px; }
    .empty-state p { color: var(--muted); }

  </style>
</head>
<body>

  <div class="breaking-bar">
    <div class="pulsing-dot"></div>
    <span>BREAKING: The World Is Watching. Are You Ready?</span>
  </div>

  <header>
    <a href="/" class="brand">
      <img src="logo.png" alt="GNH Logo" class="logo">
      <div class="brand-text">GLOBAL<span>NEW</span>SHOTS</div>
    </a>
  </header>

  <main class="container">
    <div class="news-grid" id="news-container">
      <div class="empty-state">
        <h2>System Initializing...</h2>
        <p>Connecting to global feeds. The truth is coming.</p>
      </div>
    </div>
  </main>

  <!-- Monetag sw.js registration for Push Notifications -->
  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('/sw.js');
    }
  </script>
  
  <!-- Monetag Sticky In-Page Push Banner -->
  <div style="position:fixed;bottom:0;left:0;right:0;z-index:9999;text-align:center;background:rgba(6,9,15,0.95);border-top:1px solid #c1121f;padding:6px 0;">
    <script>(function(s){s.dataset.zone='10994737',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))</script>
  </div>

  <script>
    // Fetch and render articles
    fetch('/public/articles.json?t=' + new Date().getTime())
      .then(response => {
        if (!response.ok) throw new Error('No articles yet');
        return response.json();
      })
      .then(articles => {
        if (articles.length === 0) return;
        
        const container = document.getElementById('news-container');
        container.innerHTML = '';
        
        articles.forEach(article => {
          const card = document.createElement('div');
          card.className = 'card';
          
          card.innerHTML = `
            <a href="${article.url}">
              <img src="/articles/${article.coverImage}" alt="${article.title}">
            </a>
            <div class="card-content">
              <span class="tag">EXCLUSIVE</span>
              <a href="${article.url}" class="card-title">${article.title}</a>
              <div class="card-meta">
                <span>By Global Desk</span>
                <span>${new Date(article.date).toLocaleDateString()}</span>
              </div>
            </div>
          `;
          container.appendChild(card);
        });
      })
      .catch(err => console.log('Waiting for first articles...'));
  </script>
</body>
</html>
